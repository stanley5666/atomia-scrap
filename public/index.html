<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fúzna aréna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
button,input,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{margin:0;--ink:#0a0910;--pan:#15121f;--line:#2b2637;--txt:#efe9f5;--dim:#8b869c;
 font-family:'Barlow Condensed',system-ui,sans-serif;color:var(--txt);
 background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.055) 1px,transparent 1.6px) 0 0/7px 7px,
 linear-gradient(180deg,#120f1c,#08070d 60%);background-attachment:fixed;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:14px 12px 46px}
button{font-family:inherit;cursor:pointer;color:var(--txt)}
button:focus-visible{outline:2px solid #ffc93c;outline-offset:2px}
header{text-align:center}
.brand{font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1;letter-spacing:.03em;transform:skewX(-7deg);
 background:linear-gradient(92deg,#ff2f57,#ffc93c 45%,#2ee0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:12.5px;color:var(--dim);letter-spacing:.16em;text-transform:uppercase}
.tabs{display:flex;gap:6px;justify-content:center;margin:12px 0 4px}
.tab{background:transparent;border:1px solid var(--line);padding:10px 18px;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.tab.on{border-color:#ffc93c;color:#ffc93c}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.slot{border:1px solid var(--line);background:var(--pan);padding:7px 8px}
.slot.on{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset}
.slotName{font-family:Anton,Impact,sans-serif;font-size:15px;color:var(--c);letter-spacing:.06em}
.chips{display:flex;gap:3px;margin-top:5px}
.chip{width:26px;height:26px;border:1px solid #2b2836;overflow:hidden;background:#0d0b14;flex:0 0 auto}
.chip.f{border-color:var(--c)}
.hint{font-size:14px;color:var(--dim);text-align:center;margin:12px 0 8px;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
@media(min-width:560px){.grid{grid-template-columns:repeat(5,1fr)}}
.cardWrap{background:var(--pan);border:1px solid var(--c,#3a3648);display:flex;flex-direction:column;
 cursor:pointer;transition:transform .12s;overflow:visible}
.cardWrap:active{transform:scale(.95)}
.cardWrap.used{opacity:.42;filter:saturate(.45)}
.card{background:transparent;border:0;padding:0;display:block;width:100%}
.card .art{display:block;width:100%;line-height:0}
.lbl{padding:6px 4px 8px;text-align:center;color:#efe9f5}
.nm{font-size:12.5px;font-weight:700;line-height:1.15;display:block;color:#efe9f5;overflow-wrap:anywhere}
.rl{font-size:10.5px;color:#8b869c;letter-spacing:.05em;display:block;margin-top:2px}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
@media(max-width:420px){.actions .btn{flex:1 1 46%}.dim{grid-template-columns:60px 1fr}.dimV{min-width:40px;font-size:11px}.brand{font-size:30px}}
.btn{border:1px solid var(--line);background:transparent;padding:13px 18px;font-size:15px;font-weight:700;
 letter-spacing:.1em;text-transform:uppercase;min-height:46px}
.btn.main{background:linear-gradient(92deg,#ff2f57,#ffc93c);color:#12101a;border:0}
.btn:disabled{opacity:.32;cursor:not-allowed}
.reveal{display:grid;gap:12px;margin-top:14px}
@media(min-width:560px){.reveal{grid-template-columns:1fr 1fr}.reveal .actions{grid-column:1/-1}}
.fusePanel{border:1px solid var(--c);background:var(--pan);padding:14px;text-align:center}
.stack{position:relative;height:104px;display:flex;justify-content:center;align-items:center}
.stack .p{width:62px;height:62px;border:2px solid var(--c);position:absolute;overflow:hidden;
 animation:conv .8s cubic-bezier(.5,0,.2,1) both;background:#0d0b14}
.stack .p:nth-child(1){transform:translateX(-52px) rotate(-8deg)}
.stack .p:nth-child(2){z-index:2;transform:scale(1.16)}
.stack .p:nth-child(3){transform:translateX(52px) rotate(8deg)}
@keyframes conv{from{opacity:0;transform:translateX(0) scale(.4)}}
.mini{display:flex;gap:3px;justify-content:center;margin-top:8px}
.mini span{width:22px;height:22px;overflow:hidden;border:1px solid #322c40;background:#0d0b14}
.code{font-family:Anton,Impact,sans-serif;font-size:30px;color:var(--c);transform:skewX(-7deg);margin-top:6px}
.title{font-size:12.5px;letter-spacing:.36em;color:var(--dim)}
.stats{margin-top:8px;font-size:15px}
.stats b{color:var(--dim);font-size:10.5px;margin:0 3px 0 9px;letter-spacing:.1em}
.roles{margin-top:5px;font-size:11px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.mBar{border:1px solid var(--line);background:var(--pan);padding:8px 10px;margin-top:10px;
 display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.mBar.on{border-color:var(--c);position:sticky;top:0;z-index:5;box-shadow:0 6px 14px -8px #000}
.mCode{font-family:Anton,Impact,sans-serif;font-size:19px;color:var(--c);letter-spacing:.16em;transform:skewX(-7deg)}
.mBar input{background:#0d0b14;border:1px solid var(--line);color:var(--txt);font-family:inherit;font-size:16px;
 letter-spacing:.22em;text-transform:uppercase;padding:5px 6px;width:78px;text-align:center}
.mYou{color:var(--c);font-weight:700}
.mWait{color:#ffc93c}
.mErr{color:#ff6a7a;flex-basis:100%}
.mOk{color:#3fdf8f;flex-basis:100%}
.grid.lock{opacity:.45;pointer-events:none}
.vVerdict{font-family:Anton,Impact,sans-serif;font-size:34px;color:var(--c);transform:skewX(-7deg);line-height:1.05;margin-top:10px}
.vSub{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.vConf{font-size:12.5px;letter-spacing:.06em;color:var(--dim);margin-top:9px;line-height:1.5}
.dims{display:grid;gap:8px;margin-top:18px;text-align:left}
.dim{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:center}
.dimL{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.dimBar{display:flex;align-items:center;gap:7px}
.dimV{font-size:11.5px;font-weight:700;min-width:46px;font-variant-numeric:tabular-nums}
.dimV.l{text-align:right}
.half{flex:1;height:15px;display:flex;background:#1d1a26;border-top:1px solid #262232;border-bottom:1px solid #262232}
.half.l{justify-content:flex-end;border-left:1px solid #262232}
.half.r{border-right:1px solid #262232}
.half i{display:block;height:100%;transition:width .45s}
.why{margin-top:18px;text-align:left;display:grid;gap:7px}
.why div{font-size:13.5px;line-height:1.45;padding-left:15px;position:relative}
.why div::before{content:"";position:absolute;left:0;top:6.5px;width:6px;height:6px;background:var(--c)}
.hRow{border:1px solid var(--line);background:var(--pan);padding:9px 10px;margin-bottom:8px}
.hHead{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.08em}
.hSide{display:flex;align-items:center;gap:6px;margin-top:6px}
.hSide .lbl{font-family:Anton,Impact,sans-serif;font-size:14px;color:var(--c);min-width:74px}
.hSide .faces{display:flex;gap:2px}
.hSide .faces span{width:20px;height:20px;overflow:hidden;border:1px solid #2b2637;background:#0d0b14}
.hSide.lost{opacity:.45}
.hAct{display:flex;gap:6px;margin-top:8px}
.hAct button{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;background:transparent;
 border:1px solid var(--line);padding:9px 13px;min-height:38px}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:26px 10px;border:1px dashed var(--line);margin-top:12px}
.btn.sm{padding:9px 13px;font-size:13px;letter-spacing:.08em;min-height:38px}

.simPanel{border:1px solid var(--line);background:var(--pan);padding:16px;margin-top:14px;text-align:center}
.simTitle{font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.04em}
.simBar{display:flex;height:34px;margin:14px 0 6px;overflow:hidden;border:1px solid var(--line)}
.simBar div{display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:15px;color:#0d0b14;transition:width .5s}
.simSides{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);letter-spacing:.08em}
.simGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.simGrid div{border:1px solid var(--line);padding:8px 4px}
.simGrid b{display:block;font-family:Anton,Impact,sans-serif;font-size:20px}
.simGrid span{font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.teams2{display:grid;gap:8px;margin-top:12px}
@media(min-width:560px){.teams2{grid-template-columns:1fr 1fr}}
.tBlock{border:1px solid var(--c);background:#141120;padding:9px 10px;text-align:left}
.tTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tCode{font-family:Anton,Impact,sans-serif;font-size:19px;color:var(--c);letter-spacing:.04em}
.tTitle{font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;text-align:right}
.tFaces{display:flex;gap:3px;margin-top:7px}
.tFaces span{width:27px;height:27px;overflow:hidden;border:1px solid #2b2637;background:#0d0b14;flex:0 0 auto}
.tStats{margin-top:7px;font-size:14px;font-variant-numeric:tabular-nums}
.tStats b{color:var(--dim);font-size:9.5px;margin:0 3px 0 9px;letter-spacing:.1em}
.tStats b:first-child{margin-left:0}
.badge{color:#ffc93c}
.names{font-size:9.5px;line-height:1.35;color:var(--dim);letter-spacing:.02em;margin-top:4px}
.cardWrap{display:flex;flex-direction:column}
.avIn{width:100%;margin-top:2px;background:#0d0b14;border:1px solid var(--line);border-top:0;color:var(--txt);
 font-family:inherit;font-size:16px;padding:6px 6px}
.btn.on{border-color:#ffc93c;color:#ffc93c}
.stack .p i{position:absolute;left:0;right:0;bottom:-13px;font-style:normal;font-size:8.5px;
 color:var(--dim);text-align:center;letter-spacing:.02em}
.stack{height:118px}
.filters{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
.fch{background:transparent;border:1px solid var(--line);color:var(--dim);padding:8px 11px;
 font-size:12px;letter-spacing:.09em;text-transform:uppercase;min-height:36px}
.fch.on{border-color:#ffc93c;color:#ffc93c}
.fch.team{border-color:#ff2f57;color:#ff2f57}
.gp{display:block;font-size:8.5px;letter-spacing:.09em;color:#6f6a80;margin-top:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  s2+=`<circle cx="25.4" cy="29.9" r="1.7" fill="${f.ey}"/><circle cx="38.6" cy="29.9" r="1.7" fill="${f.ey}"/>`;
  s2+=`<circle cx="24.7" cy="29.2" r=".6" fill="#fff"/><circle cx="37.9" cy="29.2" r=".6" fill="#fff"/>`;
  s2+=`<path d="M31 31 L30 36.5 L33 37" stroke="rgba(0,0,0,.22)" stroke-width="1.1" fill="none" stroke-linecap="round"/>`;
  if(f.beard) s2+=`<path d="M20 33 C22 46 27 51.5 32 51.5 C37 51.5 42 46 44 33 C41.5 42 37 44.5 32 44.5 C27 44.5 22.5 42 20 33Z" fill="${f.hr}" opacity=".94"/>`;
  else s2+=`<path d="M27 42 Q32 44.5 37 42" stroke="rgba(0,0,0,.38)" stroke-width="1.4" fill="none" stroke-linecap="round"/>`;
  if(f.patch) s2+=`<path d="M18.5 24.6 L31.5 23 L31.5 34 L19.5 34.4Z" fill="#14121a"/><path d="M17.6 21.6 L47 30" stroke="#14121a" stroke-width="1.9"/>`;
 }
 s2+=`<path d="${HEAD}" fill="none" stroke="${ink}" stroke-width="1.5"/>`;
 return s2+`</svg>`;
}
function faceBox(id,cls){return `<span class="${cls||'fbox'}" title="${HEROES[id].n}">${face(id)}</span>`;}

/* ======================= FÚZIA + BOJ ======================= */
/* Vyhodnotenie musí vyjsť rovnako na oboch mobiloch a rovnako aj pri zopakovaní,
   preto simulácie nebežia na Math.random, ale na generátore zasiatom zo zloženia
   oboch tímov. Rovnaké tímy => rovnaký verdikt, kdekoľvek. */
let RNG=Math.random;
function mulberry32(a){return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seedOf(str){let h=2166136261>>>0;
 for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

const rnd=(a,b)=>a+RNG()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function fuse(ids,team){
 const hs=ids.map(i=>HEROES[i]), avg=k=>hs.reduce((s,h)=>s+h[k],0)/hs.length;
 const roles=[...new Set(hs.map(h=>h.r))], gs=[...new Set(hs.map(h=>h.g))];
 let syn=1+Math.max(0,roles.length-3)*.03; if(gs.length===1)syn+=.08;
 const top=[...hs].sort((a,b)=>b.pow-a.pow);
 const code=top.slice(0,3).map(h=>h.n.replace(/[^A-Za-z]/g,"").slice(0,3).toUpperCase()).join("");
 const c={};hs.forEach(h=>c[h.r]=(c[h.r]||0)+1);
 const main=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];
 const maxHp=Math.round(avg("hp")*30*syn);
 return {team,code,title:gs.length===1?gs[0]:(TITLES[main]||"FÚZIA"),pure:gs.length===1?gs[0]:null,parts:hs,top:top.slice(0,3),roles,
  atk:Math.round(avg("atk")*syn),def:Math.round(avg("def")*syn),spd:Math.round(avg("spd")),
  regen:Math.round(avg("en")+6),maxHp,hp:maxHp,en:55,charge:0,shield:0,dot:[],stun:0,atkUp:0,defDown:0,cds:hs.map(()=>0)};
}
function damage(src,tgt,ab){
 let p=ab.p; if(ab.chaos) p=Math.round(p*rnd(.55,1.9));
 const atk=src.atk*(1+src.atkUp/100);
 const def=ab.pierce?tgt.def*.35:tgt.def*(1-tgt.defDown/100);
 let raw=p*(atk/70)*7*rnd(.92,1.1)*(100/(100+def*.75));
 let crit=false;
 if(RNG()<(ab.crit||0)+src.spd/900){crit=true;raw*=1.65;}
 return {dmg:Math.max(1,Math.round(raw)),crit};
}

/* ---- jadro modelovania (beží skryto, len ako podklad pre verdikt) ---- */

function resolve(me,foe,idx){
 const ult=idx===-1,hero=ult?null:me.parts[idx];
 const ab=ult?{name:"FÚZNY PRIELOM",p:Math.round(me.parts.reduce((s,h)=>s+h.ab.p,0)/3),cost:0,pierce:true}:hero.ab;
 if(ult){me.charge=0;me.shield=0;me.dot=[];me.defDown=0;}
 else{me.en-=ab.cost;me.cds[idx]=ab.cd+1;me.charge=clamp(me.charge+14,0,100);}
 let line=(ult?"☄️ ":"")+ab.name,hit=false;
 if(ab.p>0){
  const R=damage(me,foe,ab);let d=R.dmg;hit=true;
  if(foe.shield>0){const abs=Math.min(foe.shield,d);foe.shield-=abs;d-=abs;line+=" · štít pohltil "+abs;}
  foe.hp=Math.max(0,foe.hp-d);foe.charge=clamp(foe.charge+(d/foe.maxHp)*55,0,100);
  line+=" · "+d+" dmg"+(R.crit?" · KRIT!":"");
  if(ab.heal){const hl=Math.round(R.dmg*ab.heal);me.hp=Math.min(me.maxHp,me.hp+hl);line+=" · +"+hl+" hp";}
 } else if(ab.heal){
  const hl=Math.round(me.maxHp*.42*ab.heal);me.hp=Math.min(me.maxHp,me.hp+hl);line+=" · +"+hl+" hp";
 }
 if(ab.shield){const sh=Math.round(ab.shield*(me.def/70)*4);me.shield+=sh;line+=" · štít +"+sh;}
 if(ab.dot){foe.dot.push({d:Math.round(ab.dot*(me.atk/70)*3.4),turns:3});line+=" · rana horí (3 kolá)";}
 if(ab.stun&&RNG()<ab.stun){foe.stun=1;line+=" · SÚPER OMRÁČENÝ";}
 if(ab.defDown){foe.defDown=Math.min(45,foe.defDown+ab.defDown);line+=" · obrana súpera dole";}
 if(ab.atkUp){me.atkUp=Math.min(60,me.atkUp+ab.atkUp);line+=" · útok hore";}
 if(ult)line+=" · vymazané efekty";
 return {line,hit};
}

function upkeep(nf){
 nf.en=Math.min(100,nf.en+nf.regen);
 nf.cds=nf.cds.map(c=>Math.max(0,c-1));
 nf.atkUp=Math.max(0,nf.atkUp-10);nf.defDown=Math.max(0,nf.defDown-10);
 let burn=0;
 if(nf.dot.length){nf.dot=nf.dot.filter(d=>{burn+=d.d;d.turns--;return d.turns>0;});nf.hp=Math.max(0,nf.hp-burn);}
 const st=nf.stun>0; if(st)nf.stun=0;
 return {burn,dead:nf.hp<=0,stunned:st};
}

function chooseAI(me,foe){
 if(me.charge>=100)return -1;
 const low=me.hp/me.maxHp<.35;
 const score=ab=>{let s=ab.p+(ab.dot||0)*1.5+(ab.shield||0)*.6;if(ab.heal)s+=low?90:10;if(ab.stun)s+=25;if(foe.hp/foe.maxHp<.25)s=ab.p*1.6;return s;};
 const opts=me.parts.map((h,i)=>({i,ab:h.ab})).filter(o=>me.cds[o.i]===0&&me.en>=o.ab.cost);
 if(!opts.length){
  const ready=me.parts.map((h,i)=>i).filter(i=>me.cds[i]===0);
  return (ready.length?ready:me.parts.map((h,i)=>i)).sort((a,b)=>me.parts[a].ab.cost-me.parts[b].ab.cost)[0];
 }
 opts.sort((a,b)=>score(b.ab)-score(a.ab));
 return opts[0].i;
}

function setView(v){S.view=v;render();}

/* ---- davkova simulacia (bez animacie) ---- */
function simulateOne(p0,p1){
 const F=[fuse(p0,0),fuse(p1,1)];
 let active=F[0].spd>=F[1].spd?0:1;
 for(let t=1;t<=400;t++){
  const me=F[active],foe=F[1-active];
  resolve(me,foe,chooseAI(me,foe));
  if(foe.hp<=0)return {w:active,turns:t,hp:Math.round(me.hp/me.maxHp*100)};
  const next=1-active,u=upkeep(F[next]);
  if(u.dead)return {w:active,turns:t,hp:Math.round(me.hp/me.maxHp*100)};
  if(!u.stunned)active=next;
 }
 return {w:-1,turns:400,hp:0};
}
/* ======================= VYHODNOTENIE ======================= */
const EVAL_RUNS=600;

// Koľko schopností v tíme nesie ktorý efekt.
function kit(f){
 const k={shield:0,heal:0,stun:0,dot:0,pierce:0,crit:0,defDown:0,atkUp:0};
 f.parts.forEach(h=>{const a=h.ab;
  if(a.shield)k.shield++; if(a.heal)k.heal++; if(a.stun)k.stun++; if(a.dot)k.dot++;
  if(a.pierce)k.pierce++; if(a.crit)k.crit++; if(a.defDown)k.defDown++; if(a.atkUp)k.atkUp++;});
 return k;
}

// Štyri rozmery sily. Vzorce zámerne kopírujú to, čo naozaj robí damage() a upkeep(),
// aby sa rozbor nerozchádzal s číslom zo simulácií.
function analyse(f){
 const abs=f.parts.map(h=>h.ab);
 const avgP=abs.reduce((s,a)=>s+a.p,0)/abs.length;
 const avgCost=abs.reduce((s,a)=>s+a.cost,0)/abs.length;
 const k=kit(f);
 return {
  utok:     f.atk*(avgP/60)*(1+(f.regen-avgCost)/140),
  odolnost: f.maxHp*(100+f.def*.75)/100,
  tempo:    f.spd*(1+f.regen/90),
  vybava:   k.shield*26+k.heal*30+k.stun*34+k.dot*22+k.pierce*20+k.crit*18+k.defDown*14+k.atkUp*14,
  avgP,avgCost,k
 };
}

function reasons(F,A){
 const out=[],n=v=>Math.round(v).toLocaleString("sk-SK");
 const dim=(label,key)=>{
  const a=A[0][key],b=A[1][key];
  const hi=a>=b?0:1, ha=Math.max(a,b), la=Math.min(a,b);
  const rel=la>0?(ha-la)/la*100:100;
  if(rel<7)return;
  out.push({t:hi,mag:rel,txt:`${label}: ${T[hi].name} vedie o ${Math.round(rel)} % (${n(ha)} proti ${n(la)}).`});
 };
 dim("Útočný výkon","utok"); dim("Výdrž","odolnost");
 dim("Tempo","tempo"); dim("Výbava schopností","vybava");

 const names={stun:"omráčenie",heal:"liečenie",shield:"štít",dot:"horiacu ranu",
              pierce:"prienik obranou",crit:"kritický zásah"};
 Object.keys(names).forEach(key=>{
  const a=A[0].k[key],b=A[1].k[key];
  if(a===b)return;
  const hi=a>b?0:1;
  out.push({t:hi,mag:Math.abs(a-b)*9,
   txt:`${T[hi].name} má viac schopností na ${names[key]} — ${Math.max(a,b)} proti ${Math.min(a,b)}.`});
 });

 F.forEach((f,i)=>{ if(f.pure&&!F[1-i].pure)
  out.push({t:i,mag:13,txt:`${T[i].name} je zložený len zo skupiny ${f.pure}, čo mu dvíha štatistiky o 8 %.`}); });

 const first=F[0].spd>=F[1].spd?0:1;
 out.push({t:first,mag:6,txt:`${T[first].name} je rýchlejší, takže do stretnutia vstupuje prvý.`});

 return out.sort((x,y)=>y.mag-x.mag).slice(0,6);
}

function runEval(){
 RNG=mulberry32(seedOf(S.picks[0].join(",")+"|"+S.picks[1].join(",")));
 const wins=[0,0]; let draws=0,turns=0;
 for(let i=0;i<EVAL_RUNS;i++){
  const r=simulateOne(S.picks[0],S.picks[1]);
  turns+=r.turns;
  if(r.w<0)draws++; else wins[r.w]++;
 }
 RNG=Math.random;
 const decided=Math.max(1,wins[0]+wins[1]);
 const share=[wins[0]/decided*100,wins[1]/decided*100];
 const edge=Math.abs(share[0]-share[1]);
 const w=edge<4?-1:(share[0]>share[1]?0:1);
 const conf=edge<14?"tesne":edge<34?"jasne":edge<62?"výrazne":"drvivo";
 const A=[analyse(S.F[0]),analyse(S.F[1])];
 S.verdict={wins,draws,share,w,edge,conf,runs:EVAL_RUNS,
            turns:Math.round(turns/EVAL_RUNS),A,why:reasons(S.F,A)};
 S.phase="verdict"; S.view="draft";
 recordVerdict(); render();
}

/* ======================= ZÁPAS NA DVOCH ZARIADENIACH ======================= */
/* Server (relay.php) nepozná pravidlá — drží len poradie ťahov. Oba prehliadače
   si z toho istého zoznamu odvodia rovnaký stav. */
const RELAY="relay.php";

async function api(params,body){
 const opt=body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{};
 let r;
 try{ r=await fetch(RELAY+"?"+new URLSearchParams(params),opt); }
 catch(e){ throw new Error("Server neodpovedá. Si online?"); }
 let j=null; try{ j=await r.json(); }catch(e){}
 if(!r.ok||!j||j.error) throw new Error(j&&j.error?j.error:"Server odpovedal "+r.status+".");
 return j;
}

function applyRoom(R){
 const n=S.net; if(!n)return;
 n.ver=R.ver; n.turn=R.turn; n.joined=R.joined;
 S.picks=[[],[]];
 R.picks.forEach(p=>S.picks[p.seat].push(p.id));
 S.turn=R.turn;
 if(full()&&S.phase==="draft"){ netStop(); startFusion(); }
 else render();
}

function netEnter(j,code,seat){
 S.net={code:code||j.code,seat,token:j.token,ver:0,turn:0,joined:1,timer:null,busy:false};
 S.picks=[[],[]];S.turn=0;S.F=null;S.verdict=null;S.phase="draft";S.view="draft";
 S.filter=null;S.edit=false;S.netErr=null;
 applyRoom(j.room); netPoll();
}
async function netCreate(){
 S.netErr=null;S.netMsg=null;render();
 try{ netEnter(await api({a:"create"}),null,0); }
 catch(e){ S.netErr=e.message; render(); }
}
async function netJoin(code){
 code=(code||"").trim().toUpperCase(); S.netErr=null;S.netMsg=null;
 if(!/^[A-Z0-9]{4}$/.test(code)){ S.netErr="Kód má 4 znaky."; render(); return; }
 try{ netEnter(await api({a:"join",r:code}),code,1); }
 catch(e){ S.netErr=e.message; render(); }
}
function netJoinFromInput(){ const el=document.getElementById("joinCode"); netJoin(el?el.value:""); }

async function netPick(id){
 const n=S.net; if(!n||n.busy)return;
 n.busy=true; S.netErr=null;
 try{ applyRoom((await api({a:"pick",r:n.code},{seat:n.seat,token:n.token,id})).room); }
 catch(e){ S.netErr=e.message; render(); }
 finally{ n.busy=false; }
}

/* Kým ťahá súper, pýtame sa servera častejšie než keď čaká on na nás. */
function netPoll(){
 const n=S.net; if(!n)return;
 clearTimeout(n.timer);
 n.timer=setTimeout(async()=>{
  const m=S.net; if(!m||S.phase!=="draft")return;
  try{ const j=await api({a:"state",r:m.code,v:m.ver}); if(j.room)applyRoom(j.room); }
  catch(e){ S.netErr=e.message; render(); }
  netPoll();
 },(n.joined<2||n.turn!==n.seat)?1200:3000);
}
function netStop(){ if(S.net&&S.net.timer)clearTimeout(S.net.timer); }
function netLeave(){ netStop(); clearDraft(); }

function flash(m){ S.netMsg=m; render(); setTimeout(()=>{S.netMsg=null;render();},2200); }
async function shareMatch(){
 const n=S.net; if(!n)return;
 const url=location.href.split("#")[0]+"#"+n.code;
 const txt="Poď zložiť fúziu — kód "+n.code;
 try{
  if(navigator.share){ await navigator.share({title:"Fúzna aréna",text:txt,url}); return; }
  await navigator.clipboard.writeText(url); flash("Odkaz skopírovaný.");
 }catch(e){ flash("Kód: "+n.code); }
}

function matchBar(){

        :n.turn===n.seat?`<span class="mYou">si na ťahu</span>`:`ťahá súper…`;
 return `<div class="mBar on" style="--c:${T[n.seat].c}">

function draftView(){

 let h=matchBar()+`<div class="bar">`;
 for(let t=0;t<2;t++){
  h+=`<div class="slot ${S.turn===t&&!full()?"on":""}" style="--c:${T[t].c}"><div class="slotName">${T[t].name}</div><div class="chips">`;

 }
 h+=`</div>
 <div class="filters"><button class="fch ${S.filter?"":"on"}" onclick="setFilter(null)">Všetci (${HEROES.length})</button>`+
  GNAMES.map(g=>`<button class="fch ${S.filter===g?"on":""}" onclick="setFilter('${g}')">${g} (${HEROES.filter(x=>x.g===g).length})</button>`).join("")+
  (S.filter&&!full()&&!S.net?`<button class="fch team" onclick="fillGroup()">＋ Zložiť ${S.filter} pre ${T[S.turn].name}</button>`:"")+
 `</div><p class="hint">${S.edit?"Vlož URL obrázka ku ktorémukoľvek hrdinovi — uloží sa a nahradí kreslený portrét. Prázdne pole ho vráti späť.":S.net?(S.net.joined<2?"Pošli súperovi kód a počkaj, kým sa pripojí.":lock?"Súper vyberá…":"Si na ťahu — ťuk na hrdinu."):full()?"Zostavy sú plné — vyhodnoť fúziu.":"Ťuk na hrdinu — vyberá "+T[S.turn].name+"."}</p><div class="grid${lock?" lock":""}">`;
  HEROES.filter(x=>!S.filter||x.g===S.filter).forEach(x=>{
  const t0=S.picks[0].includes(x.id),t1=S.picks[1].includes(x.id);
  const c=t0?T[0].c:t1?T[1].c:"#3a3648";
  h+=`<div class="cardWrap ${t0||t1?"used":""}" style="--c:${c}" onclick="pick(${x.id})">
   <button class="card" aria-label="${x.n}"><span class="art">${face(x.id)}</span></button>
   <div class="lbl"><span class="nm">${x.n}</span><span class="rl">${x.r} · ${x.pow}</span><span class="gp">${x.g}</span></div>`;
  if(S.edit)h+=`<input class="avIn" placeholder="URL obrázka" value="${S.custom[x.id]||""}" onchange="setAvatar(${x.id},this.value)">`;
  h+=`</div>`;
 });
 h+=`</div><div class="actions">`;
 if(!S.net) h+=`<button class="btn" onclick="randomFill()" ${full()?"disabled":""}>Náhodne doplniť</button>
  <button class="btn" onclick="clearDraft()">Vyčistiť</button>`;
 h+=`<button class="btn ${S.edit?"on":""}" onclick="toggleEdit()">${S.edit?"Hotovo":"Vlastné obrázky"}</button>`;
 if(!S.net) h+=`<button class="btn main" onclick="startFusion()" ${full()?"":"disabled"}>Vyhodnotiť fúziu</button>`;
 h+=`</div>`;
 return h;
}
function verdictView(){
 const v=S.verdict, w=v.w, c=w<0?"#8b869c":T[w].c;
 const teamBlock=f=>`<div class="tBlock" style="--c:${T[f.team].c}">
   <div class="tTop"><b class="tCode">${f.code}</b><span class="tTitle">${f.title}${f.pure?" · +8%":""}</span></div>
   <div class="tFaces">${f.parts.map(x=>`<span title="${x.n}">${face(x.id)}</span>`).join("")}</div>
   <div class="tStats"><b>ÚT</b>${f.atk}<b>OBR</b>${f.def}<b>RÝCH</b>${f.spd}<b>HP</b>${f.maxHp}</div>
   <div class="names">${f.parts.map(p=>p.n).join(" · ")}</div></div>`;
 // Obe strany sa škálujú k väčšej z nich, aby bol rozdiel naozaj vidieť —
 // podiel z dvoch podobných čísel by vždy vyzeral ako 50:50.
 const num=x=>Math.round(x).toLocaleString("sk-SK");
 const bar=(a,b)=>{
  const mx=Math.max(a,b,1e-6);
  return `<span class="dimV l" style="color:${T[0].c}">${num(a)}</span>`+
         `<div class="half l"><i style="width:${a/mx*100}%;background:${T[0].c}"></i></div>`+
         `<div class="half r"><i style="width:${b/mx*100}%;background:${T[1].c}"></i></div>`+
         `<span class="dimV" style="color:${T[1].c}">${num(b)}</span>`;
 };
 const dim=(label,key)=>`<div class="dim"><span class="dimL">${label}</span><div class="dimBar">${bar(v.A[0][key],v.A[1][key])}</div></div>`;

 return `<div class="simPanel" style="--c:${c}">
  <div class="simTitle">VYHODNOTENIE</div>
  <div class="teams2">${teamBlock(S.F[0])}${teamBlock(S.F[1])}</div>
  ${w<0?`<div class="vVerdict">ZHODA</div><div class="vSub">ani jedna fúzia nemá navrch</div>`
       :`<div class="vVerdict">${S.F[w].code}</div><div class="vSub">${T[w].name} je ${v.conf} silnejší</div>`}
  <div class="vConf">${Math.round(v.share[0])} % : ${100-Math.round(v.share[0])} % prevahy · ${v.runs} modelovaných stretnutí<br>
   stretnutie trvá priemerne ${v.turns} ťahov${v.draws?` · ${v.draws} skončilo bez rozhodnutia`:""}</div>
  <div class="dims">${dim("Útok","utok")}${dim("Výdrž","odolnost")}${dim("Tempo","tempo")}${dim("Výbava","vybava")}</div>
  <div class="why">${v.why.map(r=>`<div style="--c:${T[r.t].c}">${r.txt}</div>`).join("")}</div>
  <div class="actions">
   <button class="btn" onclick="setView('hist')">História</button>
   <button class="btn main" onclick="clearDraft()">Nový draft</button></div></div>`;
}
function histView(){
 if(!S.hist.length)return `<div class="empty">Zatiaľ žiadne zostavy. Zlož tímy a spusti fúziu — uložia sa sem aj s vyhodnotením.</div>`;
 return S.hist.map(e=>{
  const d=new Date(e.ts),ds=d.toLocaleDateString("sk-SK")+" "+d.toLocaleTimeString("sk-SK",{hour:"2-digit",minute:"2-digit"});
  const side=(ids,code,t)=>`<div class="hSide ${e.w!=null&&e.w>=0&&e.w!==t?"lost":""}" style="--c:${T[t].c}">
    <span class="lbl">${code}</span><span class="faces">${ids.map(i=>`<span title="${HEROES[i].n}">${face(i)}</span>`).join("")}</span>
    ${e.w===t?'<span style="color:#ffc93c;font-size:12px;letter-spacing:.1em">SILNEJŠÍ</span>':""}</div>
    <div class="names" style="text-align:left;margin:0 0 4px 80px">${ids.map(i=>HEROES[i].n).join(" · ")}</div>`;
  return `<div class="hRow"><div class="hHead"><span>${ds}</span><span>${e.sim?`<span class="badge">${e.sim}</span> · `:""}${e.w==null?"nevyhodnotené":e.w<0?"zhoda":T[e.w].name+" silnejší"}</span></div>
   ${side(e.a,e.ca,0)}${side(e.b,e.cb,1)}
   <div class="hAct"><button onclick="loadTeams(${e.id})">Načítať zostavy</button><button onclick="delHist(${e.id})">Zmazať</button></div></div>`;
 }).join("");
}
render();loadHist();loadCustom();
const hashCode=(location.hash||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase();
if(/^[A-Z0-9]{4}$/.test(hashCode)) netJoin(hashCode);
</script>
